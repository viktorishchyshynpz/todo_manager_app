name: todo_manager
description: "A simple and efficient To-Do list manager built with Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Core Dependencies
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_analytics: ^12.0.4
  firebase_crashlytics: ^5.0.5
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Local Storage
  shared_preferences: ^2.5.3

  # Notifications
  flutter_local_notifications: ^18.0.0
  flutter_timezone: ^3.0.1
  timezone: ^0.10.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.2
  flutter_svg: ^2.2.3

# Dev Dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Flutter Launcher Icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

# Flutter Settings
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700